<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#008080"/>
      <stop offset="100%" style="stop-color:#006666"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Folder background -->
  <rect x="15" y="25" width="70" height="55" rx="8" fill="url(#folderGradient)" filter="url(#shadow)"/>
  
  <!-- Folder tab -->
  <path d="M15 25 L35 25 L40 35 L15 35 Z" fill="#006666"/>
  
  <!-- Pulse line -->
  <polyline points="25,52 35,52 40,42 45,62 50,52 55,52 60,42 65,62 70,52 80,52" 
            stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
